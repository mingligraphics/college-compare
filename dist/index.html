ns:repeat(4,1fr);gap:14px}label{font-size:12px;color:var(--muted);display:block}select{display:block;width:100%;margin-top:6px;background:white;border:1px solid var(--line);border-radius:8px;padding:11px;color:var(--ink)}.note{font-size:12px;margin-top:14px}.resultsbar{display:flex;align-items:center;justify-content:space-between;gap:15px;margin:34px 0 18px}.resultsbar h2{font-size:19px;margin:0}.resultsbar span{font-size:13px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.school{background:white;border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;transition:box-shadow .2s}.school:hover{box-shadow:0 8px 22px #18342f0c}.school .top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:19px}.monogram{background:#eef2e9;min-width:42px;min-height:42px;border-radius:10px;display:flex;align-items:center;padding:6px 10px;font-size:14px;font-weight:600;line-height:1.35;min-width:0;max-width:100%;overflow-wrap:anywhere;white-space:normal}.location{font-size:12px;color:var(--muted)}.school h3{font-size:20px;line-height:1.4;margin:0 0 3px}.en{font-size:12px;color:var(--muted);min-height:40px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:16px 10px;border-top:1px solid #edf0e9;margin:18px 0;padding-top:17px}.stat span{font-size:12px;display:block;color:var(--muted)}.stat strong{font-size:18px;font-weight:600}.stat em{display:block;font-size:11px;font-style:normal;color:var(--muted)}.stat.cost{grid-column:1/-1}.actions{display:flex;gap:8px;margin-top:auto}.actions button{flex:1;font-size:13px;padding:9px}.primary{background:var(--green);border-color:var(--green);color:white}.selected{background:#edf3ed;color:var(--green)}.empty{grid-column:1/-1;text-align:center;padding:60px;background:white;border-radius:12px}.tray{position:fixed;bottom:0;left:0;right:0;background:#fffffff5;backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:5;padding:15px 24px}.trayinner{max-width:1132px;margin:auto;display:flex;align-items:center;gap:16px}.traytitle{font-size:14px;font-weight:600;white-space:nowrap}.traytitle small{display:block;font-size:11px;color:var(--muted);font-weight:400}.chips{display:flex;gap:8px;flex:1;flex-wrap:wrap}.chips button{font-size:12px;background:var(--paper);padding:7px 10px}.tray .primary{white-space:nowrap}.trayhint{font-size:12px;color:var(--muted)}dialog{border:0;border-radius:16px;width:min(780px,calc(100% - 28px));max-height:85vh;padding:28px;color:var(--ink)}dialog::backdrop{background:#18342f66}dialog h2{margin:0;font-size:26px}.dialogtop{display:flex;justify-content:space-between;gap:15px;margin-bottom:20px}.detailgrid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:25px 0}.detailgrid div{border-bottom:1px solid var(--line);padding-bottom:12px}.detailgrid span{display:block;color:var(--muted);font-size:12px}.detailgrid strong{font-size:19px}table{width:100%;border-collapse:collapse;margin:22px 0}td,th{padding:14px 10px;text-align:left;border-bottom:1px solid var(--line);font-size:14px}th{background:var(--paper)}.tablewrap{overflow:auto}.pages{display:flex;justify-content:center;align-items:center;gap:15px;margin-top:30px}.source{font-size:12px;padding:14px;background:var(--paper);border-radius:8px}.toast{position:fixed;bottom:115px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;border-radius:8px;padding:10px 18px;z-index:10}.toast[hidden]{display:none}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.hero aside{display:none}.filters{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){nav{padding:16px}.brand{font-size:17px}.brand small{font-size:9px}.navlinks{gap:12px;font-size:13px}.tag{display:none}main{padding:0 16px 205px}.hero{padding:35px 0 22px}.hero p{font-size:14px}.grid{grid-template-columns:1fr}.tray{padding:12px 16px}.trayinner{flex-wrap:wrap;gap:10px}.chips{flex-basis:65%}.trayinner>.primary{margin-left:auto}.trayhint{display:none}.resultsbar{align-items:flex-start}.school{padding:20px}.detailgrid{gap:14px}dialog{padding:20px}}
.school .top{align-items:flex-start}.school .top .monogram{flex:1}.control-badge{margin-left:auto;flex:none;white-space:nowrap;padding:6px 8px;border-radius:6px;background:#f6f7f2}.ranking{font-size:12px;color:var(--muted);margin-top:10px}.school .monogram{font-size:clamp(11px,1.1vw,14px)}@media(max-width:560px){.school .monogram{font-size:14px}}
</style><header><nav><div class="brand">College Compare<small>从探索开始，让选择更清晰</small></div><div class="navlinks"><button class="active" id="exploreNav">探索大学</button><button id="compareNav">比较大学</button><span class="tag">独立测试版</span></div></nav></header><main><section class="hero"><div><div class="eyebrow">EXPLORE YOUR POSSIBILITIES</div><h1>发现适合你的美国大学</h1><p>不止于排名。从校园规模、地理位置和留学预算出发，<br>发现更多值得了解的选择。</p></div><aside><strong id="total">—</strong><span>所大学，一起探索<br>从好奇，到自己的选择。</span></aside></section><div class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" aria-label="搜索大学" placeholder="搜索中文名、英文名或简称，如：纽约大学 / NYU"></div><div class="filters"><label>地理位置<select id="region"><option value="">全部地区</option></select></label><label>每年学费<select id="tuition"><option value="">全部学费</option><option value="low">低于 $30,000</option><option value="mid">$30,000 至低于 $50,000</option><option value="high">$50,000 至低于 $70,000</option><option value="top">$70,000 及以上</option></select></label><label>本科生规模<select id="size"><option value="">全部规模</option><option value="small">小型 · 少于 5,000 人</option><option value="medium">中型 · 5,000–15,000 人</option><option value="large">大型 · 超过 15,000 人</option></select></label><label>国际生比例<select id="international"><option value="">全部比例</option><option value="low">低于 5%</option><option value="mid">5% 至低于 10%</option><option value="high">10% 至低于 20%</option><option value="top">20% 及以上</option></select></label></div><p class="note" id="dataNote"></p><div class="resultsbar"><div><h2>探索大学 <span id="count" aria-live="polite"></span></h2><span>按现有目录顺序展示 · 不代表排名或推荐</span></div><button id="reset">重置筛选</button></div><section class="grid" id="grid" aria-label="大学列表"></section><div class="pages"><button id="prev">上一页</button><span id="pageInfo"></span><button id="next">下一页</button></div></main><div class="tray"><div class="trayinner"><div class="traytitle">我的比较名单<small id="trayCount"></small></div><div class="chips" id="chips"></div><span class="trayhint" id="trayHint">加入两所大学，开始比较</span><button class="primary" id="compare">比较大学 →</button></div></div><dialog id="dialog"><div id="dialogContent"></div></dialog><div class="toast" id="toast" role="status" hidden></div><script src="api.js"></script><script>
const regionNames={east_coast:'美国东海岸',south:'美国南部',midwest:'美国中西部',west_coast:'美国西海岸',mountain_west:'美国西部山区',other:'美国其他地区'};
const typeNames={research_university:'综合大学',national_university:'综合大学',university:'综合大学',liberal_arts_college:'文理学院',national_liberal_arts_college:'文理学院'};
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let schools=[],selected=[],page=1,filtered=[],comparisonRequest=0;const perPage=12;
const present=v=>v!==null&&v!==undefined&&v!=='';const num=v=>present(v)?Number(v).toLocaleString('en-US'):'暂无数据';const money=v=>present(v)?'$'+Number(v).toLocaleString('en-US'):'暂无数据';const rate=v=>present(v)?Number(v).toFixed(1)+'%':'暂无数据';const schoolLocation=s=>[s.city_cn||s.city,s.state_cn||s.state].filter(Boolean).join('，')||'暂无数据';const type=s=>typeNames[s.school_type]||null;
const control=s=>({public:'公立',private_nonprofit:'私立',private_forprofit:'私立'})[s.institution_control]||'暂无数据';
const rankCategories={national_university:'全美综合大学',national_liberal_arts_college:'全美文理学院',liberal_arts_college:'全美文理学院',regional_university_north:'北部地区大学',regional_university_midwest:'中西部地区大学',regional_university_south:'南部地区大学',regional_university_west:'西部地区大学'};
const ranking=s=>present(s.ranking_usnews)&&rankCategories[s.ranking_category]?`U.S. News · ${rankCategories[s.ranking_category]} #${s.ranking_usnews}`:'U.S. News · 暂无数据';
function notify(t){$('toast').textContent=t;$('toast').hidden=false;setTimeout(()=>$('toast').hidden=true,2200)}
function add(id){if(selected.includes(id))selected=selected.filter(x=>x!==id);else{if(selected.length===2){notify('当前比较支持两所大学，请先移除一所');return}selected.push(id)}try{localStorage.setItem('cc-discovery-prototype',JSON.stringify(selected))}catch(e){}render();tray()}
function tray(){$('trayCount').textContent=selected.length+' / 2 所大学';$('chips').innerHTML=selected.map(id=>{let s=schools.find(x=>x.school_id===id);return `<button data-remove="${esc(id)}" aria-label="移除${esc(s.school_name_cn)}">${esc(s.school_name_cn)} ×</button>`}).join('');$('compare').disabled=selected.length!==2;$('trayHint').textContent=selected.length===2?'名单已就绪':'加入两所大学，开始比较';$('chips').querySelectorAll('button').forEach(b=>b.onclick=()=>add(b.dataset.remove))}
function internationalValue(s){return s.international_pct_scope==='undergraduate'&&present(s.international_pct)&&Number.isFinite(Number(s.international_pct))&&s.international_pct>=0&&s.international_pct<=100?Number(s.international_pct):null}
function apply(){page=1;const q=$('search').value.trim().toLowerCase(),r=$('region').value,z=$('size').value,t=$('tuition').value,i=$('international').value;filtered=schools.filter(s=>{if(q&&![s.school_name_cn,s.school_name,s.short_name].some(v=>(v||'').toLowerCase().includes(q)))return false;if(r&&s.region!==r)return false;if(z){const n=s.undergrad_enrollment;if(!present(n)||!(z==='small'?n<5000:z==='medium'?n>=5000&&n<=15000:n>15000))return false}if(t){const n=s.tuition_fees;if(!present(n)||!(t==='low'?n<30000:t==='mid'?n>=30000&&n<50000:t==='high'?n>=50000&&n<70000:n>=70000))return false}if(i){const n=internationalValue(s);if(n===null||!(i==='low'?n<5:i==='mid'?n>=5&&n<10:i==='high'?n>=10&&n<20:n>=20))return false}return true});render()}
function fitCardNames(){for(const e of document.querySelectorAll('.monogram')){e.style.fontSize='';e.style.minHeight='0';for(let n=0;n<12;n++){const c=getComputedStyle(e),height=e.getBoundingClientRect().height-parseFloat(c.paddingTop)-parseFloat(c.paddingBottom),font=parseFloat(c.fontSize);if(height<=2*parseFloat(c.lineHeight)+1||font<=9)break;e.style.fontSize=(font-0.5)+'px'}}}
window.addEventListener('resize',fitCardNames);
function abbreviationBadge(s){const name=typeof s.short_name==='string'?s.short_name.trim():'';return /[A-Za-z]/.test(name)&&!/[\u3400-\u9fff]/.test(name)?`<span class="monogram">${esc(name)}</span>`:''}
function render(){$('count').textContent=`· ${filtered.length} 所`;const pages=Math.max(1,Math.ceil(filtered.length/perPage));page=Math.min(page,pages);$('pageInfo').textContent=`${page} / ${pages}`;$('prev').disabled=page===1;$('next').disabled=page===pages;$('grid').innerHTML=filtered.slice((page-1)*perPage,page*perPage).map(s=>`<article class="school"><div class="top">${abbreviationBadge(s)}<span class="location control-badge">${esc(control(s))}</span></div><h3>${esc(s.school_name_cn||s.school_name)}</h3><div class="en">${esc(s.school_name)}</div><div class="location">${esc(schoolLocation(s))}</div><div class="stats"><div class="stat"><span>本科生人数</span><strong>${num(s.undergrad_enrollment)}</strong><em>${esc(s.undergrad_enrollment_year||'年份暂无数据')}</em></div><div class="stat"><span>录取率</span><strong>${rate(s.acceptance_rate)}</strong><em>${esc(s.admissions_year||'年份暂无数据')}</em></div><div class="stat cost"><span>年度总费用（美元）</span><strong>${money(s.coa)}</strong><em>${esc(s.coa_year||'年份暂无数据')}</em></div></div><div class="ranking">大学排名：${esc(ranking(s))}</div><div class="actions"><button data-detail="${esc(s.school_id)}">查看详情 ↗</button><button data-add="${esc(s.school_id)}" class="${selected.includes(s.school_id)?'selected':'primary'}" aria-pressed="${selected.includes(s.school_id)}">${selected.includes(s.school_id)?'已加入 · 移除':'＋ 加入比较'}</button></div></article>`).join('')||'<div class="empty"><h3>没有找到匹配的大学</h3><p>试试减少筛选条件，或搜索其他名称。</p><button onclick="document.getElementById(\'reset\').click()">清除筛选</button></div>';$('grid').querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(b.dataset.add));$('grid').querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>detail(b.dataset.detail));fitCardNames()}
function modal(content){$('dialogContent').innerHTML=content;$('dialog').showModal();$('close').onclick=()=>$('dialog').close()}
function detail(id){const s=schools.find(x=>x.school_id===id);modal(`<div class="dialogtop"><div><h2>${esc(s.school_name_cn)}</h2><p>${esc(s.school_name)}</p></div><button id="close" aria-label="关闭详情">关闭 ×</button></div><p>${esc(schoolLocation(s))} · ${esc(type(s)||'学校类型暂无数据')}</p><div class="detailgrid">${[['本科生人数',num(s.undergrad_enrollment),s.undergrad_enrollment_year],['录取率',rate(s.acceptance_rate),s.admissions_year],['年度总费用 · 美元',money(s.coa),s.coa_year],['每年学费（含杂费）· 美元',money(s.tuition_fees),s.tuition_fees_year],['国际本科生比例',rate(internationalValue(s)),s.international_pct_year]].map(([k,v,y])=>`<div><span>${k}</span><strong>${v}</strong><span>${esc(y||'年份暂无数据')}</span></div>`).join('')}</div><p class="source">来源：College Compare 现有已发布比较接口。各项数据年份分别标注。COA 沿用现有口径，未统一核验是否含国际生额外费用。</p><p style="margin:16px 0">校园介绍：暂无数据</p><button class="primary" id="detailAdd">${selected.includes(id)?'从比较名单移除':'加入比较'}</button>`);$('detailAdd').onclick=()=>{add(id);$('detailAdd').textContent=selected.includes(id)?'从比较名单移除':'加入比较'}}
async function compare(){
 if(selected.length!==2){notify('请先加入两所大学');return}
 const ids=[...selected],requestId=++comparisonRequest;modal('<h2>正在获取比较数据…</h2><button id="close">关闭 ×</button>');
 try {const rows=await CollegeAPI.pair(...ids);
 if(requestId!==comparisonRequest||!$('dialog').open||selected.join('|')!==ids.join('|'))return;
 showComparison(rows);
 }catch(e){if(requestId===comparisonRequest&&$('dialog').open&&selected.join('|')===ids.join('|')){modal('<h2>暂时无法获取比较数据</h2><p>请检查网络连接并重试。</p><button id="close">关闭 ×</button><button id="retryPair">重试</button>');$('retryPair').onclick=compare}}
}
async function loadDirectory(){
 $('grid').innerHTML='<p role="status">正在获取大学目录…</p>'; $('dataNote').textContent='正在连接 Supabase…';
 try {schools=await CollegeAPI.directory();filtered=schools;
 let saved;try{saved=JSON.parse(localStorage.getItem('cc-discovery-prototype')||'[]')}catch(e){};
 selected=Array.isArray(saved)?[...new Set(saved)].filter(id=>schools.some(s=>s.school_id===id)).slice(0,2):[];
 $('total').textContent=schools.length;
 $('region').innerHTML='<option value="">全部地区</option>';Object.entries(regionNames).filter(([k])=>schools.some(s=>s.region===k)).forEach(([k,v])=>$('region').add(new Option(v,k)));
 $('dataNote').textContent=`目录获取时间：${new Date().toLocaleString('zh-CN')} · ${schools.length} 所大学。每年学费为学杂费（美元），不含食宿等 COA 费用；国际生比例仅使用本科生口径。年份按各校标注；缺失值在“全部”中保留，选择区间时排除。`;
 apply();tray();
 }catch(e){$('dataNote').textContent='大学目录暂时无法获取，请检查网络连接。';$('grid').innerHTML='<div class="empty"><h3>连接失败</h3><button id="retryDirectory">重新获取目录</button></div>';$('retryDirectory').onclick=loadDirectory}
}
function showComparison(ss){modal(`<div class="dialogtop"><div><div class="eyebrow">COMPARE YOUR OPTIONS</div><h2>比较大学</h2></div><button id="close">返回探索 ×</button></div><div class="tablewrap"><table><thead><tr><th>比较维度</th>${ss.map(s=>`<th>${esc(s.school_name_cn)}</th>`).join('')}</tr></thead><tbody>${[['地理位置',schoolLocation],['大学排名（U.S. News）',ranking],['学校类型',s=>type(s)||'暂无数据'],['本科生人数',s=>num(s.undergrad_enrollment)],['录取率',s=>rate(s.acceptance_rate)],['年度总费用 · 美元',s=>money(s.coa)],['每年学费（含杂费）· 美元',s=>money(s.tuition_fees)],['国际本科生比例',s=>rate(internationalValue(s))]].map(([k,f])=>`<tr><td>${k}</td>${ss.map(s=>`<td>${esc(f(s))}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="source">比较数据由 Supabase 实时获取。下方可进入现有完整比较页面，所选大学会自动带入。</p><p style="margin-top:20px"><a class="primary" style="display:inline-block;text-decoration:none;padding:10px 16px;border-radius:8px" href="existing-comparison.html?a=${encodeURIComponent(selected[0])}&b=${encodeURIComponent(selected[1])}">进入现有完整比较 →</a></p>`)}
['search','region','tuition','size','international'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',apply));$('reset').onclick=()=>{['search','region','tuition','size','international'].forEach(id=>$(id).value='');apply()};$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render();$('grid').scrollIntoView({behavior:'smooth',block:'start'})};$('compare').onclick=compare;$('compareNav').onclick=compare;$('exploreNav').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});$('dialog').addEventListener('click',e=>{if(e.target===$('dialog')){const r=$('dialog').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('dialog').close()}});render();tray();loadDirectory();
</script></html>
