<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>选学校</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  color:#202020;background:#fafafa;line-height:1.65;
}
main{max-width:560px;margin:auto;padding:30px 18px 64px}
header{padding:8px 2px 16px}
h1{font-size:30px;letter-spacing:-.5px;margin:0 0 5px;font-weight:800}
.tagline{font-size:14px;color:#777;margin:0}
.picker{
  background:#fff;border-radius:18px;padding:18px;
  box-shadow:0 3px 18px rgba(0,0,0,.06);margin-top:18px
}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 6px}
select{
  width:100%;min-height:48px;border:1px solid #e7e7e7;border-radius:12px;
  padding:10px 12px;background:#f8f8f8;color:#222;font:inherit
}
button{
  width:100%;min-height:48px;border:0;border-radius:24px;margin-top:18px;
  background:#ff2442;color:#fff;font:inherit;font-weight:700;font-size:16px;
  cursor:pointer
}
.error{font-size:13px;color:#777;min-height:18px;margin-top:8px}
.result{display:none}
.section-label{font-size:13px;color:#999;margin:30px 2px 8px}
.summary{
  background:#fff;border-radius:18px;padding:19px 18px;
  box-shadow:0 3px 18px rgba(0,0,0,.055)
}
.summary h2{font-size:20px;margin:0 0 10px}
.summary p{margin:0;font-size:15px}
.school{
  background:#fff;border-radius:18px;padding:20px 18px;margin-top:16px;
  box-shadow:0 3px 18px rgba(0,0,0,.055)
}
.school h2{font-size:21px;margin:0 0 14px}
.row{padding:12px 0;border-bottom:1px solid #f0f0f0}
.row:last-child{border-bottom:0}
dt{font-size:12px;color:#999;margin-bottom:2px}
dd{margin:0;font-size:15px;font-weight:500}
.money{font-size:19px;font-weight:750}
.sources{margin-top:26px;padding:4px 3px}
.sources h2{font-size:15px;margin-bottom:6px}
.muted{color:#999;font-size:12px}
</style>
</head>
<body>
<main>
<header>
  <h1>选学校</h1>
  <p class="tagline">你最好的美国选校指南</p>
</header>

<section class="picker">
  <label for="a">第一所学校</label>
  <select id="a">
    <option value="nyu">纽约大学</option>
    <option value="bu">波士顿大学</option>
    <option value="neu">东北大学</option>
  </select>

  <label for="b">第二所学校</label>
  <select id="b">
    <option value="nyu">纽约大学</option>
    <option value="bu" selected>波士顿大学</option>
    <option value="neu">东北大学</option>
  </select>

  <button id="go">开始比较</button>
  <div class="error" id="err"></div>
</section>

<section class="result" id="result">
  <div class="section-label">选校指南</div>
  <section class="summary">
    <h2 id="summaryTitle"></h2>
    <p id="summaryText"></p>
  </section>

  <div class="section-label">学校信息</div>
  <div id="cards"></div>

  <section class="sources">
    <h2>数据说明</h2>
    <p class="muted">当前为产品原型。除纽约大学示例数据外，其余数据主要用于功能测试；正式版本将标注数据年份、定义、来源和更新时间。</p>
  </section>
</section>
</main>

<script>
const schools={
nyu:{name:"纽约大学",region:"美国东北部",location:"纽约州纽约市",u:29000,t:68576,c:100998,maj:["商科","电影","计算机科学"],sal:82000,al:["校友 A","校友 B","校友 C"]},
bu:{name:"波士顿大学",region:"美国东北部",location:"马萨诸塞州波士顿",u:18500,t:65000,c:90000,maj:["传播学","商科","生物医学科学"],sal:76000,al:["校友 D","校友 E","校友 F"]},
neu:{name:"东北大学",region:"美国东北部",location:"马萨诸塞州波士顿",u:21000,t:67000,c:92000,maj:["计算机科学","工程","商科"],sal:80000,al:["校友 G","校友 H","校友 I"]}
};
const money=n=>"$"+n.toLocaleString("en-US");

function summary(a,b){
  let sentences=[];
  if(a.region===b.region) sentences.push(`${a.name}和${b.name}都位于${a.region}。`);

  let sizeDiff=Math.abs(a.u-b.u), base=Math.min(a.u,b.u);
  if(sizeDiff/base<.2) sentences.push(`两所学校的本科生规模比较接近。`);
  else {
    let big=a.u>b.u?a:b, small=big===a?b:a;
    sentences.push(`${big.name}的本科生规模更大，约有${big.u.toLocaleString("en-US")}名本科生，而${small.name}约有${small.u.toLocaleString("en-US")}名。`);
  }

  let costDiff=Math.abs(a.c-b.c);
  if(costDiff<5000) sentences.push(`两校一年的总开销也比较接近。`);
  else {
    let high=a.c>b.c?a:b, low=high===a?b:a;
    sentences.push(`费用方面差异更明显：${high.name}一年的总开销约为${money(high.c)}，比${low.name}高约${money(costDiff)}。如果预算是选校的重要考虑因素，这个差距值得特别留意。`);
  }
  return sentences.join("");
}

function card(s){
 return `<section class="school">
   <h2>${s.name}</h2>
   <dl>
    <div class="row"><dt>地理位置</dt><dd>${s.location}</dd></div>
    <div class="row"><dt>本科生规模</dt><dd>${s.u.toLocaleString("en-US")}</dd></div>
    <div class="row"><dt>2026–27 学年学费</dt><dd class="money">${money(s.t)}</dd></div>
    <div class="row"><dt>总开销</dt><dd class="money">${money(s.c)}</dd></div>
    <div class="row"><dt>明星专业</dt><dd>${s.maj.join(" · ")}</dd></div>
    <div class="row"><dt>毕业生平均薪水</dt><dd>${money(s.sal)} <span class="muted">（dummy）</span></dd></div>
    <div class="row"><dt>知名校友</dt><dd>${s.al.join(" · ")}</dd></div>
   </dl>
 </section>`;
}

document.getElementById("go").addEventListener("click",()=>{
 const aid=document.getElementById("a").value,bid=document.getElementById("b").value;
 const err=document.getElementById("err"),res=document.getElementById("result");
 if(aid===bid){err.textContent="请选择两所不同的学校";res.style.display="none";return}
 err.textContent="";
 const a=schools[aid],b=schools[bid];
 document.getElementById("summaryTitle").textContent=`${a.name} vs ${b.name}`;
 document.getElementById("summaryText").textContent=summary(a,b);
 document.getElementById("cards").innerHTML=card(a)+card(b);
 res.style.display="block";
 res.scrollIntoView({behavior:"smooth"});
});
</script>
</body>
</html>
