<body>
<main>
<header>
  <h1 class="site-title"><span class="cap-icon" aria-hidden="true"><svg viewBox="0 0 64 64" focusable="false"><path d="M4 24 32 10l28 14-28 14L4 24Zm12 7.5V43c0 5 7.2 9 16 9s16-4 16-9V31.5L32 40 16 31.5Zm39-3.2v15.8c0 1.6 1.3 2.9 2.9 2.9s2.9-1.3 2.9-2.9V25.4L55 28.3Z"/></svg></span><span>美国大学选校对比</span></h1>
  <p class="tagline">覆盖美国200所高校真实数据 · 团队成员毕业于常青藤名校</p>
</header>

<section class="picker">
  <label for="a">第一所学校</label>
  <select id="a" disabled><option>正在读取 school.csv…</option></select>

  <label for="b">第二所学校</label>
  <select id="b" disabled><option>正在读取 school.csv…</option></select>

  <button id="go" disabled>开始比较</button>
  <div class="status" id="status"></div>
  <div class="error" id="err"></div>
</section>

<section class="result" id="result">
  <div class="section-label">选校指南</div>
  <section class="summary">
    <h2 id="summaryTitle"></h2>
    <p id="summaryText"></p>
  </section>

  <div class="section-label">学校信息</div>
  <div id="cards"></div>

  <div class="section-label">个性化申请支持</div>
  <section class="consult">
    <p>我们提供个性化选校与文书服务。</p>
    <p></p>
    <div class="qr-crop"><img src="./wechat-qr.jpeg" alt="微信二维码"></div>
  </section>

  <section class="sources">
    <h2>数据说明</h2>
    <p class="muted">本页直接读取同一 GitHub repository 中的 school.csv。新增学校或更新数据后，只需更新 CSV；页面逻辑无需修改。</p>
  </section>
</section>
</main>

<script>
const DATA_URL = "./school.csv";
let schools = {};
const USD_CNY_RATE = 7;

function parseCSV(text){
  const rows=[]; let row=[], cell="", quoted=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i], next=text[i+1];
    if(ch === '"'){
      if(quoted && next === '"'){ cell += '"'; i++; }
      else quoted = !quoted;
    } else if(ch === ',' && !quoted){
      row.push(cell); cell="";
    } else if((ch === '\n' || ch === '\r') && !quoted){
      if(ch === '\r' && next === '\n') i++;
      row.push(cell); cell="";
      if(row.some(v=>v.trim()!=="")) rows.push(row);
      row=[];
    } else cell += ch;
  }
  if(cell.length || row.length){ row.push(cell); if(row.some(v=>v.trim()!=="")) rows.push(row); }
  if(!rows.length) return [];
  const headers=rows.shift().map(h=>h.replace(/^\uFEFF/,"").trim());
  return rows.map(r=>{
    const obj={};
    headers.forEach((h,i)=>obj[h]=(r[i]??"").trim());
    return obj;
  });
}

function num(v){
  if(v==="" || v==null) return null;
  const n=Number(String(v).replace(/[$,%\s,]/g,""));
  return Number.isFinite(n) ? n : null;
}

function list(v){
  if(!v) return [];
  return v.split(/\s*[;|｜、]\s*/).map(x=>x.trim()).filter(Boolean);
}

function normalize(r){
  return {
    id:r.school_id,
    name:r.school_name_cn || r.school_name || r.school_id,
    nameEn:r.school_name || "",
    shortName:r.short_name || "",
    city:r.city || "",
    cityCN:r.city_cn || "",
    state:r.state || "",
    region:r.region || "",
    locationCN:r.location_cn || "",
    schoolType:r.school_type || "",
    tuition:num(r.tuition),
    tuitionYear:r.tuition_year || "",
    coa:num(r.coa),
    coaYear:r.coa_year || "",
    undergrad:num(r.undergrad_enrollment),
    firstYear:num(r.first_year_enrollment),
    internationalPct:r.international_pct || "",
    campusType:r.campus_type || "",
    campusCN:r.campus_description_cn || r.campus_description || "",
    majors:list(r.famous_majors_cn || r.famous_majors),
    career:r.career_model_cn || r.career_model || "",
    alumni:list(r.notable_alumni_cn || r.notable_alumni)
  };
}

function money(n){ return n==null ? "" : "$"+Math.round(n).toLocaleString("en-US"); }
function moneyWanCN(n){ return n==null ? "" : (n/10000).toFixed(1)+"万美元"; }
function moneyRmbWan(n){ return n==null ? "" : Math.round(n*7/10000)+"万元人民币"; }
function locationText(s){ return s.locationCN || [s.state,s.city].filter(Boolean).join(""); }
function displayCity(s){ return s.cityCN || s.city; }

function compare(a,b){
  return {
    sameRegion:!!a.region && a.region===b.region,
    sameCity:!!a.city && a.city===b.city,
    sameType:!!a.schoolType && a.schoolType===b.schoolType,
    bothCost:a.coa!=null && b.coa!=null,
    costDiff:(a.coa!=null && b.coa!=null)?Math.abs(a.coa-b.coa):null,
    majorOverlap:a.majors.filter(m=>b.majors.includes(m)),
    onlyA:a.majors.filter(m=>!b.majors.includes(m)),
    onlyB:b.majors.filter(m=>!a.majors.includes(m))
  };
}

/*
Summary order:
1. Location
2. Public/private
3. Total cost
4. Famous-major overlap/differences

The program decides the facts first, then turns them into one natural paragraph.
*/
function summary(a,b){
  const c=compare(a,b);
  const sentences=[];

  if(c.sameCity){
    sentences.push(`${a.name}和${b.name}都位于${displayCity(a)}`);
  } else if(c.sameRegion){
    sentences.push(`${a.name}和${b.name}都位于${a.region}，${a.name}在${displayCity(a)}，${b.name}在${displayCity(b)}`);
  } else if(a.region && b.region){
    sentences.push(`${a.name}位于${a.region}的${displayCity(a)}，${b.name}位于${b.region}的${displayCity(b)}`);
  } else {
    sentences.push(`${a.name}位于${locationText(a)}，${b.name}位于${locationText(b)}`);
  }

  if(a.schoolType && b.schoolType){
    sentences.push(c.sameType
      ? `两所学校都是${a.schoolType}`
      : `${a.name}是${a.schoolType}，而${b.name}是${b.schoolType}`);
  }

  if(c.bothCost){
    if(a.coa===b.coa){
      sentences.push(`费用方面，两校${a.coaYear || b.coaYear || ""}学年的年度总开销都约为${moneyWanCN(a.coa)}，约${moneyRmbWan(a.coa)}。`);
    } else {
      const high=a.coa>b.coa?a:b, low=high===a?b:a;
      sentences.push(`费用方面，${high.name}${high.coaYear ? high.coaYear+"学年" : ""}的年度总开销约为${moneyWanCN(high.coa)}，约${moneyRmbWan(high.coa)}，高于${low.name}的${moneyWanCN(low.coa)}，约${moneyRmbWan(low.coa)}。`);
    }
  }

  if(a.majors.length && b.majors.length){
    let s=c.majorOverlap.length
      ? `专业上，两校都在${c.majorOverlap.join("、")}等领域有较强项目`
      : `专业上，两校目前列出的明星专业没有明显重合`;

    if(c.onlyA.length && c.onlyB.length){
      s += `，但${a.name}在${c.onlyA.join("、")}等方向更有代表性，而${b.name}则在${c.onlyB.join("、")}等领域更突出`;
    } else if(c.onlyA.length){
      s += `，此外${a.name}在${c.onlyA.join("、")}等方向更有代表性`;
    } else if(c.onlyB.length){
      s += `，此外${b.name}在${c.onlyB.join("、")}等方向更有代表性`;
    }
    sentences.push(s);
  }

  return sentences.map(s=>s.replace(/[。；;，,]+$/,"")).join("。")+"。";
}

function row(label,value,cls=""){
  if(value==="" || value==null || (Array.isArray(value)&&!value.length)) return "";
  const shown=Array.isArray(value)?value.join(" · "):value;
  return `<div class="row"><dt>${label}</dt><dd class="${cls}">${shown}</dd></div>`;
}
function rowAlways(label,value,cls=""){
  const shown=Array.isArray(value)?value.join(" · "):(value ?? "");
  return `<div class="row"><dt>${label}</dt><dd class="${cls}">${shown}</dd></div>`;
}

function card(s){
  const enrollment=s.undergrad!=null
    ? s.undergrad.toLocaleString("en-US")
    : (s.firstYear!=null ? `${s.firstYear.toLocaleString("en-US")}（新生人数）` : "");

  return `<section class="school">
    <h2>${s.name}</h2>
    <dl>
      ${row("地理位置",locationText(s))}
      ${row("美国地区",s.region)}
      ${row("学校性质",s.schoolType)}
      ${row("本科生规模",enrollment)}
      ${row(s.tuitionYear ? `${s.tuitionYear} 学年学费` : "学费",money(s.tuition),"money")}
      ${row(s.coaYear ? `${s.coaYear} 学年总开销` : "总开销",money(s.coa),"money")}
      ${rowAlways("明星专业",s.majors)}
      ${row("国际生",s.internationalPct)}
      ${row("校园",s.campusCN || s.campusType)}
      ${row("职业特色",s.career)}
      ${rowAlways("知名校友",s.alumni)}
    </dl>
  </section>`;
}

function fillSelectors(list){
  const options=list.map(s=>`<option value="${s.id}">${s.name}</option>`).join("");
  const a=document.getElementById("a"), b=document.getElementById("b");
  a.innerHTML=options; b.innerHTML=options;
  a.disabled=false; b.disabled=false;
  if(list.length>1) b.selectedIndex=1;
  document.getElementById("go").disabled=list.length<2;
}

async function loadData(){
  const status=document.getElementById("status");
  const err=document.getElementById("err");
  status.textContent="正在读取学校数据…";
  try{
    const res=await fetch(DATA_URL+"?v="+Date.now(),{cache:"no-store"});
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const records=parseCSV(await res.text());
    const list=records.map(normalize).filter(s=>s.id && s.name);
    schools=Object.fromEntries(list.map(s=>[s.id,s]));
    fillSelectors(list);
    status.textContent=`已读取 ${list.length} 所学校`;
    if(list.length<2) err.textContent="当前数据库只有一所学校；加入第二所学校后即可开始比较。";
  } catch(e){
    console.error(e);
    status.textContent="";
    err.textContent="school.csv 读取失败。请确认它与 index.html 位于同一 GitHub repository 的同一目录。";
  }
}

document.getElementById("go").addEventListener("click",()=>{
  const aid=document.getElementById("a").value;
  const bid=document.getElementById("b").value;
  const err=document.getElementById("err");
  const result=document.getElementById("result");

  if(aid===bid){
    err.textContent="请选择两所不同的学校";
    result.style.display="none";
    return;
  }

  err.textContent="";
  const a=schools[aid], b=schools[bid];
  document.getElementById("summaryTitle").textContent=`${a.name} vs ${b.name}`;
  document.getElementById("summaryText").textContent=summary(a,b);
  document.getElementById("cards").innerHTML=card(a)+card(b);
  result.style.display="block";
  result.scrollIntoView({behavior:"smooth"});
});

loadData();
</script>
</body>
</html>
