<script>
const DATA_URL = "./school.csv";
const COMPARE_URL = "https://hmnoqybdcfwqbjhorwzd.supabase.co/functions/v1/compare-schools";
let schools = {};
let comparing = false;
let selectionVersion = 0;
const USD_CNY_RATE = 7;

function parseCSV(text){
  const rows=[]; let row=[], cell="", quoted=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i], next=text[i+1];
    if(ch === '"'){
      if(quoted && next === '"'){ cell += '"'; i++; }
      else quoted = !quoted;
    } else if(ch === ',' && !quoted){
      row.push(cell); cell="";
    } else if((ch === '\n' || ch === '\r') && !quoted){
      if(ch === '\r' && next === '\n') i++;
      row.push(cell); cell="";
      if(row.some(v=>v.trim()!=="")) rows.push(row);
      row=[];
    } else cell += ch;
  }
  if(cell.length || row.length){ row.push(cell); if(row.some(v=>v.trim()!=="")) rows.push(row); }
  if(!rows.length) return [];
  const headers=rows.shift().map(h=>h.replace(/^\uFEFF/,"").trim());
  return rows.map(r=>{
    const obj={};
    headers.forEach((h,i)=>obj[h]=(r[i]??"").trim());
    return obj;
  });
}

function num(v){
  if(v==="" || v==null) return null;
  const n=Number(String(v).replace(/[$,%\s,]/g,""));
  return Number.isFinite(n) ? n : null;
}

function list(v){
  if(!Array.isArray(v)) return [];
  return v.filter(x=>typeof x==="string").map(x=>x.trim()).filter(Boolean);
}

function normalize(r){
  const majorsCN=list(r.famous_majors_cn);
  const internationalPct=r.international_pct;
  return {
    id:r.school_id,
    name:r.school_name_cn || r.school_name || r.school_id,
    nameEn:r.school_name || "",
    shortName:r.short_name || "",
    city:r.city || "",
    cityCN:r.city_cn || "",
    state:r.state || "",
    region:r.region || "",
    locationCN:r.location_cn || "",
    schoolType:r.school_type || "",
    tuition:num(r.tuition),
    tuitionYear:r.tuition_year || "",
    coa:num(r.coa),
    coaYear:r.coa_year || "",
    undergrad:num(r.undergrad_enrollment),
    firstYear:num(r.first_year_enrollment),
    internationalPct:typeof internationalPct==="number" && Number.isFinite(internationalPct) && internationalPct>=0 && internationalPct<=100 ? `${internationalPct}%` : "",
    campusType:r.campus_type || "",
    campusCN:r.campus_description_cn || r.campus_description || "",
    majors:majorsCN.length ? majorsCN : list(r.famous_majors),
    career:r.career_model_cn || r.career_model || "",
    alumni:list(r.notable_alumni_cn || r.notable_alumni)
  };
}

function money(n){ return n==null ? "" : "$"+Math.round(n).toLocaleString("en-US"); }
function moneyWanCN(n){ return n==null ? "" : (n/10000).toFixed(1)+"万美元"; }
function moneyRmbWan(n){ return n==null ? "" : Math.round(n*7/10000)+"万元人民币"; }
function locationText(s){ return s.locationCN || [s.state,s.city].filter(Boolean).join(""); }
function displayCity(s){ return s.cityCN || s.city; }

function compare(a,b){
  return {
    sameRegion:!!a.region && a.region===b.region,
    sameCity:!!a.city && a.city===b.city,
    sameType:!!a.schoolType && a.schoolType===b.schoolType,
    bothCost:a.coa!=null && b.coa!=null,
    costDiff:(a.coa!=null && b.coa!=null)?Math.abs(a.coa-b.coa):null,
    majorOverlap:a.majors.filter(m=>b.majors.includes(m)),
    onlyA:a.majors.filter(m=>!b.majors.includes(m)),
    onlyB:b.majors.filter(m=>!a.majors.includes(m))
  };
}

/*
Summary order:
1. Location
2. Public/private
3. Total cost
4. Famous-major overlap/differences

The program decides the facts first, then turns them into one natural paragraph.
*/
function summary(a,b){
  const c=compare(a,b);
  const sentences=[];

  if(c.sameCity){
    sentences.push(`${a.name}和${b.name}都位于${displayCity(a)}`);
  } else if(c.sameRegion){
    sentences.push(`${a.name}和${b.name}都位于${a.region}，${a.name}在${displayCity(a)}，${b.name}在${displayCity(b)}`);
  } else if(a.region && b.region){
    sentences.push(`${a.name}位于${a.region}的${displayCity(a)}，${b.name}位于${b.region}的${displayCity(b)}`);
  } else {
    sentences.push(`${a.name}位于${locationText(a)}，${b.name}位于${locationText(b)}`);
  }

  if(a.schoolType && b.schoolType){
    sentences.push(c.sameType
      ? `两所学校都是${a.schoolType}`
      : `${a.name}是${a.schoolType}，而${b.name}是${b.schoolType}`);
  }

  if(c.bothCost){
    if(a.coa===b.coa){
      sentences.push(`费用方面，两校${a.coaYear || b.coaYear || ""}学年的年度总开销都约为${moneyWanCN(a.coa)}，约${moneyRmbWan(a.coa)}。`);
    } else {
      const high=a.coa>b.coa?a:b, low=high===a?b:a;
      sentences.push(`费用方面，${high.name}${high.coaYear ? high.coaYear+"学年" : ""}的年度总开销约为${moneyWanCN(high.coa)}，约${moneyRmbWan(high.coa)}，高于${low.name}的${moneyWanCN(low.coa)}，约${moneyRmbWan(low.coa)}。`);
    }
  }

  if(a.majors.length && b.majors.length){
    let s=c.majorOverlap.length
      ? `专业上，两校都在${c.majorOverlap.join("、")}等领域有较强项目`
      : `专业上，两校目前列出的明星专业没有明显重合`;

    if(c.onlyA.length && c.onlyB.length){
      s += `，但${a.name}在${c.onlyA.join("、")}等方向更有代表性，而${b.name}则在${c.onlyB.join("、")}等领域更突出`;
    } else if(c.onlyA.length){
      s += `，此外${a.name}在${c.onlyA.join("、")}等方向更有代表性`;
    } else if(c.onlyB.length){
      s += `，此外${b.name}在${c.onlyB.join("、")}等方向更有代表性`;
    }
    sentences.push(s);
  }

  return sentences.map(s=>s.replace(/[。；;，,]+$/,"")).join("。")+"。";
}

function esc(v){
  return String(v ?? "").replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
}
function enrollmentText(s){
  if(s.undergrad!=null) return s.undergrad.toLocaleString("en-US");
  if(s.firstYear!=null) return `${s.firstYear.toLocaleString("en-US")}（新生人数）`;
  return "";
}
function cellValue(v,cls=""){
  const text=Array.isArray(v)?v.join(" · "):v;
  return `<div class="metric-cell"><span class="metric-value ${cls}">${text ? esc(text) : '<span class="metric-empty">暂无数据</span>'}</span></div>`;
}
function metric(title,aValue,bValue,opts={}){
  const long=opts.long?" metric-long":"";
  const normalizedValue=v=>(Array.isArray(v)?v.filter(x=>String(x ?? "").trim()).join(" · "):String(v ?? "")).trim();
  aValue=normalizedValue(aValue); bValue=normalizedValue(bValue);
  const labels=opts.long
    ? `<div class="metric-cell"><span class="metric-school-label">${esc(opts.aLabel)}</span><span class="metric-value">${aValue?esc(Array.isArray(aValue)?aValue.join(" · "):aValue):'<span class="metric-empty">暂无数据</span>'}</span></div><div class="metric-cell"><span class="metric-school-label">${esc(opts.bLabel)}</span><span class="metric-value">${bValue?esc(Array.isArray(bValue)?bValue.join(" · "):bValue):'<span class="metric-empty">暂无数据</span>'}</span></div>`
    : cellValue(aValue,opts.cls||"")+cellValue(bValue,opts.cls||"");
  return `<section class="metric${long}"><h3 class="metric-title">${esc(title)}</h3><div class="metric-cols">${labels}</div>${opts.insight?`<p class="metric-insight">${esc(opts.insight)}</p>`:""}</section>`;
}
function costCell(s){
  if(s.coa==null) return "";
  return `${moneyRmbWan(s.coa)}|${moneyWanCN(s.coa)}${s.coaYear?" · "+s.coaYear:""}`;
}
function costMetric(a,b){
  const render=s=>{
    if(s.coa==null) return `<div class="metric-cell"><span class="metric-empty">暂无数据</span></div>`;
    return `<div class="metric-cell"><span class="metric-money">${esc(moneyRmbWan(s.coa))}</span><span class="metric-sub">${esc(moneyWanCN(s.coa))}${s.coaYear?" · "+esc(s.coaYear):""}</span></div>`;
  };
  let insight="";
  if(a.coa!=null&&b.coa!=null&&a.coa!==b.coa){
    const high=a.coa>b.coa?a:b;
    insight=`${high.shortName||high.name} 年度总开销高约 ${moneyRmbWan(Math.abs(a.coa-b.coa))}`;
  }
  return `<section class="metric"><h3 class="metric-title">年度总开销</h3><div class="metric-cols">${render(a)}${render(b)}</div>${insight?`<p class="metric-insight">${esc(insight)}</p>`:""}</section>`;
}
function comparisonDetail(a,b){
  const aHead=a.shortName||a.nameEn||a.name, bHead=b.shortName||b.nameEn||b.name;
  return `<div class="compare-detail">
    <div class="compare-sticky">
      <div class="compare-school-head"><span class="compare-school-short">${esc(aHead)}</span><span class="compare-school-cn">${esc(a.name)}</span></div>
      <div class="compare-school-head"><span class="compare-school-short">${esc(bHead)}</span><span class="compare-school-cn">${esc(b.name)}</span></div>
    </div>
    ${metric("地理位置", [locationText(a),a.region].filter(Boolean).join(" · "), [locationText(b),b.region].filter(Boolean).join(" · "))}
    ${metric("学校性质",a.schoolType,b.schoolType)}
    ${metric("学费",a.tuition==null?"":money(a.tuition)+(a.tuitionYear?" · "+a.tuitionYear+" 学年":""),b.tuition==null?"":money(b.tuition)+(b.tuitionYear?" · "+b.tuitionYear+" 学年":""))}
    ${costMetric(a,b)}
    ${metric("本科生规模",enrollmentText(a),enrollmentText(b))}
    ${metric("明星专业",a.majors,b.majors)}
    ${metric("国际生",a.internationalPct,b.internationalPct)}
    ${metric("校园特点",a.campusCN||a.campusType,b.campusCN||b.campusType,{long:true,aLabel:aHead,bLabel:bHead})}
    ${metric("职业特色",a.career,b.career,{long:true,aLabel:aHead,bLabel:bHead})}
    ${metric("知名校友",a.alumni,b.alumni,{long:true,aLabel:aHead,bLabel:bHead})}
  </div>`;
}

function fillSelectors(list){
  const options=list.map(s=>`<option value="${s.id}">${s.name}</option>`).join("");
  const a=document.getElementById("a"), b=document.getElementById("b");
  a.innerHTML=`<option value="">选择一所大学</option>`+options; b.innerHTML=`<option value="">选择另一所大学</option>`+options;
  a.disabled=false; b.disabled=false;
  document.getElementById("triggerA").disabled=false;
  document.getElementById("triggerB").disabled=false;
  document.getElementById("triggerAText").textContent="选择一所大学";
  document.getElementById("triggerBText").textContent="选择另一所大学";
  document.getElementById("go").disabled=list.length<2;
}

async function loadData(){
  const status=document.getElementById("status");
  const err=document.getElementById("err");
  status.textContent="正在读取学校数据…";
  try{
    const res=await fetch(DATA_URL+"?v="+Date.now(),{cache:"no-store"});
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const records=parseCSV(await res.text());
    const list=records.map(r=>({
      id:r.school_id,
      name:r.school_name_cn || r.school_name || r.school_id,
      nameEn:r.school_name || "",
      shortName:r.short_name || ""
    })).filter(s=>s.id && s.name);
    schools=Object.fromEntries(list.map(s=>[s.id,s]));
    fillSelectors(list);
    status.textContent=`已读取 ${list.length} 所学校`;
    if(list.length<2) err.textContent="当前数据库只有一所学校；加入第二所学校后即可开始比较。";
  } catch(e){
    console.error(e);
    status.textContent="";
    err.textContent="school.csv 读取失败。请确认它与 index.html 位于同一 GitHub repository 的同一目录。";
  }
}

document.getElementById("go").addEventListener("click",async ()=>{
  if(comparing) return;
  const aid=document.getElementById("a").value;
  const bid=document.getElementById("b").value;
  const err=document.getElementById("err");
  const result=document.getElementById("result");

  if(!aid || !bid){
    err.textContent="请先选择两所大学";
    result.style.display="none";
    return;
  }

  if(aid===bid){
    err.textContent="请选择两所不同的学校";
    result.style.display="none";
    return;
  }

  err.textContent="";
  result.style.display="none";
  if(!schools[aid] || !schools[bid]){
    err.textContent="学校目录读取异常，请刷新页面后重试";
    return;
  }
  const go=document.getElementById("go");
  const label=go.textContent;
  const version=selectionVersion;
  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),15000);
  comparing=true;
  go.disabled=true;
  go.textContent="正在比较…";
  try{
    const res=await fetch(COMPARE_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({schoolA:aid,schoolB:bid}),
      signal:controller.signal,
      cache:"no-store"
    });
    if(!res.ok) throw new Error("Comparison request failed");
    const records=await res.json();
    if(!Array.isArray(records) || records.length!==2 ||
       records[0]?.school_id!==aid || records[1]?.school_id!==bid){
      throw new Error("Invalid comparison response");
    }
    if(version!==selectionVersion) return;
    const [a,b]=records.map(normalize);
    document.getElementById("summaryTitle").textContent=`${a.name} vs ${b.name}`;
    document.getElementById("summaryText").textContent=summary(a,b);
    document.getElementById("cards").innerHTML=comparisonDetail(a,b);
    result.style.display="block";
    result.scrollIntoView({behavior:"smooth"});
  } catch(e){
    if(version===selectionVersion){
      result.style.display="none";
      err.textContent="暂时无法获取比较数据，请稍后重试";
    }
  } finally{
    clearTimeout(timeout);
    comparing=false;
    go.disabled=false;
    go.textContent=label;
  }
});


let activeSchoolPicker="";
const modal=document.getElementById("schoolModal");
const searchInput=document.getElementById("schoolSearch");
const schoolList=document.getElementById("schoolList");
const resultLabel=document.getElementById("resultLabel");

function searchableText(s){
  return [s.name,s.nameEn,s.shortName].filter(Boolean).join(" ").toLowerCase();
}
function drawSchoolList(){
  const q=searchInput.value.trim().toLowerCase();
  resultLabel.textContent=q ? "搜索结果" : "热门学校";
  let items=Object.values(schools);
  if(q) items=items.filter(s=>searchableText(s).includes(q));
  items=items.slice(0,q?30:10);
  schoolList.innerHTML="";
  if(!items.length){ schoolList.innerHTML='<div class="school-empty">没有找到匹配的学校</div>'; return; }
  items.forEach(s=>{
    const el=document.createElement("button");
    el.type="button"; el.className="school-option";
    const cn=document.createElement("span"); cn.className="school-option-cn"; cn.textContent=s.name;
    const en=document.createElement("span"); en.className="school-option-en";
    en.textContent=[s.nameEn,s.shortName].filter(Boolean).join(" · ");
    el.append(cn,en);
    el.addEventListener("click",()=>selectSchoolFromPicker(s.id));
    schoolList.appendChild(el);
  });
}
function openPicker(which){
  activeSchoolPicker=which;
  document.getElementById("sheetTitle").textContent=which==="a"?"选择一所大学":"选择另一所大学";
  searchInput.value="";
  drawSchoolList();
  modal.hidden=false;
  document.body.style.overflow="hidden";
  setTimeout(()=>searchInput.focus(),50);
}
function closePicker(){
  modal.hidden=true; document.body.style.overflow=""; activeSchoolPicker="";
}
function selectSchoolFromPicker(id){
  const s=schools[id]; if(!s || !activeSchoolPicker) return;
  const select=document.getElementById(activeSchoolPicker);
  if(select.value!==id){
    selectionVersion++;
    document.getElementById("result").style.display="none";
  }
  select.value=id;
  const isA=activeSchoolPicker==="a";
  document.getElementById(isA?"triggerAText":"triggerBText").textContent=s.name+(s.shortName?" · "+s.shortName:"");
  document.getElementById(isA?"triggerA":"triggerB").classList.add("selected");
  document.getElementById("err").textContent="";
  closePicker();
}
document.getElementById("triggerA").addEventListener("click",()=>openPicker("a"));
document.getElementById("triggerB").addEventListener("click",()=>openPicker("b"));
document.getElementById("sheetClose").addEventListener("click",closePicker);
modal.addEventListener("click",e=>{if(e.target===modal)closePicker()});
searchInput.addEventListener("input",drawSchoolList);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!modal.hidden)closePicker()});

loadData();
</script>
</body>
</html>
