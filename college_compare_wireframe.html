<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>学校比较 Wireframe</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#111;line-height:1.55;background:#fff}
main{max-width:560px;margin:auto;padding:28px 20px 60px}
h1{font-size:24px;margin:0 0 6px}
h2{font-size:19px;margin-top:32px}
h3{font-size:16px;margin:14px 0 8px}
.muted{color:#666;font-size:13px}
.box{border:1px solid #bbb;padding:16px;margin-top:24px}
label{display:block;font-size:13px;margin:12px 0 5px}
select,button{
  width:100%;
  min-height:46px;
  padding:10px 12px;
  font:inherit;
  border:1px solid #999;
  background:#fff;
  color:#111;
  border-radius:0;
}
button{margin-top:16px;background:#111;color:#fff}
.result{display:none}
.summary,.school,.sources{border-top:1px solid #bbb;margin-top:28px;padding-top:18px}
.row{padding:11px 0;border-bottom:1px solid #e5e5e5}
dt{font-size:12px;color:#666}
dd{margin:2px 0 0}
.error{font-size:13px;color:#555;margin-top:8px;min-height:18px}
</style>
</head>
<body>
<main>
  <h1>比较两所大学</h1>
  <p class="muted">Neutral wireframe · 所有数字均为功能测试用 dummy data</p>

  <div class="box">
    <label for="a">学校 A</label>
    <select id="a">
      <option value="nyu">纽约大学</option>
      <option value="bu">波士顿大学</option>
      <option value="neu">东北大学</option>
    </select>

    <label for="b">学校 B</label>
    <select id="b">
      <option value="nyu">纽约大学</option>
      <option value="bu" selected>波士顿大学</option>
      <option value="neu">东北大学</option>
    </select>

    <button id="go" type="button">开始比较</button>
    <div class="error" id="err"></div>
  </div>

  <div class="result" id="result">
    <h2>比较结果</h2>
    <div class="summary">
      <h3>相似之处</h3>
      <ul id="same"></ul>
      <h3>主要区别</h3>
      <ul id="diff"></ul>
    </div>

    <div id="cards"></div>

    <div class="sources">
      <h2>数据说明</h2>
      <p class="muted">正式版本可在这里显示数据年份、定义、来源与更新时间。本页除纽约大学示例外均为 dummy data，纽约大学数字也仅用于原型展示。</p>
    </div>
  </div>
</main>

<script>
(function(){
  const schools = {
    nyu: {
      name:"纽约大学", region:"美国东北部", location:"纽约州纽约市",
      undergrad:29000, tuition:68576, coa:100998,
      majors:["商科","电影","计算机科学"], salary:82000,
      alumni:["校友 A","校友 B","校友 C"]
    },
    bu: {
      name:"波士顿大学", region:"美国东北部", location:"马萨诸塞州波士顿",
      undergrad:18500, tuition:65000, coa:90000,
      majors:["传播学","商科","生物医学科学"], salary:76000,
      alumni:["校友 D","校友 E","校友 F"]
    },
    neu: {
      name:"东北大学", region:"美国东北部", location:"马萨诸塞州波士顿",
      undergrad:21000, tuition:67000, coa:92000,
      majors:["计算机科学","工程","商科"], salary:80000,
      alumni:["校友 G","校友 H","校友 I"]
    }
  };

  const money = n => "$" + Number(n).toLocaleString("en-US");

  function makeCard(s){
    return `
      <section class="school">
        <h2>${s.name}</h2>
        <dl>
          <div class="row"><dt>地理位置</dt><dd>${s.location}</dd></div>
          <div class="row"><dt>本科生规模</dt><dd>${s.undergrad.toLocaleString("en-US")}</dd></div>
          <div class="row"><dt>2026–27 学年学费</dt><dd>${money(s.tuition)}</dd></div>
          <div class="row"><dt>总开销</dt><dd>${money(s.coa)}</dd></div>
          <div class="row"><dt>明星专业</dt><dd>${s.majors.join(" · ")}</dd></div>
          <div class="row"><dt>毕业生平均薪水</dt><dd>${money(s.salary)} <span class="muted">(dummy)</span></dd></div>
          <div class="row"><dt>知名校友</dt><dd>${s.alumni.join(" · ")}</dd></div>
        </dl>
      </section>`;
  }

  document.getElementById("go").addEventListener("click", function(){
    const aId = document.getElementById("a").value;
    const bId = document.getElementById("b").value;
    const err = document.getElementById("err");
    const result = document.getElementById("result");

    if(aId === bId){
      err.textContent = "请选择两所不同的学校。";
      result.style.display = "none";
      return;
    }

    err.textContent = "";
    const a = schools[aId];
    const b = schools[bId];

    const similarities = [];
    const differences = [];

    if(a.region === b.region){
      similarities.push(`${a.name}和${b.name}都位于${a.region}。`);
    }

    const sizeDiff = Math.abs(a.undergrad - b.undergrad);
    const sizeBase = Math.min(a.undergrad, b.undergrad);
    if(sizeDiff / sizeBase < 0.2){
      similarities.push("两校本科生规模相近。");
    }else{
      differences.push(`${a.undergrad > b.undergrad ? a.name : b.name}的本科生规模更大。`);
    }

    const coaDiff = Math.abs(a.coa - b.coa);
    if(coaDiff < 5000){
      similarities.push("两校年度总开销接近。");
    }else{
      const higher = a.coa > b.coa ? a : b;
      const lower = higher === a ? b : a;
      differences.push(`${higher.name}年度总开销约为${money(higher.coa)}，比${lower.name}高约${money(coaDiff)}。`);
    }

    document.getElementById("same").innerHTML =
      similarities.map(x => `<li>${x}</li>`).join("");
    document.getElementById("diff").innerHTML =
      differences.map(x => `<li>${x}</li>`).join("");
    document.getElementById("cards").innerHTML =
      makeCard(a) + makeCard(b);

    result.style.display = "block";
    result.scrollIntoView({behavior:"smooth"});
  });
})();
</script>
</body>
</html>
